<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anytime Smoke and Vape Menu</title>
    <style>
        /* Keep the requested orange, purple, green, and black theme while removing the smoke effects. */
        html, body {
            background: #000000 !important;
        }

        body::before,
        .smoke-layer,
        .smoke {
            display: none !important;
        }
    </style>
</head>
<body>
    <script>
        const sourceUrl = 'https://raw.githubusercontent.com/egcaptaingibbs-bit/Vapelist/644f44056279cfa6c7488d0663f956146e8b56fb/index.html';

        fetch(sourceUrl)
            .then((response) => {
                if (!response.ok) throw new Error(`Menu request failed: ${response.status}`);
                return response.text();
            })
            .then((source) => {
                const parsed = new DOMParser().parseFromString(source, 'text/html');
                const smokeLayer = parsed.querySelector('.smoke-layer');
                if (smokeLayer) smokeLayer.remove();

                parsed.querySelectorAll('style').forEach((style) => {
                    document.head.appendChild(style.cloneNode(true));
                });

                const elements = Array.from(parsed.body.children).filter((element) => !element.matches('script'));
                document.body.replaceChildren(...elements);

                const disableSmoke = document.createElement('style');
                disableSmoke.textContent = `
                    body::before, .smoke-layer, .smoke { display: none !important; }
                    html, body { background: #000000 !important; }
                `;
                document.head.appendChild(disableSmoke);

                parsed.body.querySelectorAll('script').forEach((legacyScript) => {
                    const script = document.createElement('script');
                    script.textContent = legacyScript.textContent;
                    document.body.appendChild(script);
                });
            })
            .catch((error) => {
                document.body.textContent = 'The menu could not be loaded. Please refresh the page.';
                console.error(error);
            });
    </script>
</body>
</html>
