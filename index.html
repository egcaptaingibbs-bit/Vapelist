<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anytime Smoke and Vape Menu</title>
    <style>
        html, body { background: #000000 !important; }
        #pin-status { color: #c68cff; font: 0.9rem 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <script>
        const EDITOR_SOURCE = 'https://raw.githubusercontent.com/egcaptaingibbs-bit/Vapelist/2e3695a26cb4b01d6ab91f2e9f052b918bbab063/index.html';
        const EDITOR_PIN = '2468';
        let allowingEditClick = false;

        fetch(EDITOR_SOURCE)
            .then((response) => {
                if (!response.ok) throw new Error(`Menu request failed: ${response.status}`);
                return response.text();
            })
            .then((source) => {
                const parsed = new DOMParser().parseFromString(source, 'text/html');

                parsed.querySelectorAll('style').forEach((style) => {
                    document.head.appendChild(style.cloneNode(true));
                });

                const smokeLayer = parsed.querySelector('.smoke-layer');
                if (smokeLayer) smokeLayer.remove();

                const bodyElements = Array.from(parsed.body.children).filter((element) => !element.matches('script'));
                document.body.replaceChildren(...bodyElements);

                parsed.body.querySelectorAll('script').forEach((legacyScript) => {
                    const script = document.createElement('script');
                    script.textContent = legacyScript.textContent;
                    document.body.appendChild(script);
                });

                const style = document.createElement('style');
                style.textContent = `
                    body::before, .smoke-layer, .smoke { display: none !important; }
                    html, body { background: #000000 !important; }
                `;
                document.head.appendChild(style);

                const status = document.createElement('span');
                status.id = 'pin-status';
                status.textContent = 'Editing is PIN protected.';
                document.getElementById('editor-toolbar')?.appendChild(status);

                document.addEventListener('click', (event) => {
                    const editButton = event.target.closest('#edit-menu-button');
                    if (!editButton || allowingEditClick) return;

                    event.preventDefault();
                    event.stopImmediatePropagation();

                    const enteredPin = window.prompt('Enter the 4-digit editor PIN:');
                    if (enteredPin === EDITOR_PIN) {
                        // Do not persist authorization: entering editing mode always requires the PIN.
                        status.textContent = 'Editor unlocked. PIN will be required again next time.';
                        allowingEditClick = true;
                        try {
                            editButton.click();
                        } finally {
                            allowingEditClick = false;
                        }
                    } else if (enteredPin !== null) {
                        status.textContent = 'Incorrect PIN. Editing remains locked.';
                        window.alert('Incorrect PIN.');
                    }
                }, true);
            })
            .catch((error) => {
                document.body.textContent = 'The menu could not be loaded. Please refresh the page.';
                console.error(error);
            });
    </script>
</body>
</html>
