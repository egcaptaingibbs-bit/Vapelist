<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anytime Smoke and Vape Menu</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(12, 8, 16, 0.88);
            --text-color: #e8dff0;
            --title-color: #ffffff;
            --accent-color: #ff7a00;
            --sold-out-color: #b84cff;
            --price-color: #39ff88;
        }

        html, body {
            background: #000000 !important;
        }

        body {
            position: relative;
            isolation: isolate;
            color: var(--text-color) !important;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 122, 0, 0.12), transparent 30%),
                radial-gradient(circle at 82% 25%, rgba(184, 76, 255, 0.14), transparent 34%),
                radial-gradient(circle at 52% 90%, rgba(57, 255, 136, 0.08), transparent 32%),
                #000000;
        }

        .smoke-layer {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.75;
        }

        .smoke {
            position: absolute;
            width: 38vw;
            height: 38vw;
            min-width: 280px;
            min-height: 280px;
            border-radius: 50%;
            filter: blur(55px);
            opacity: 0.22;
            mix-blend-mode: screen;
            animation: drift 24s ease-in-out infinite alternate;
        }

        .smoke-orange {
            top: -12%;
            left: -8%;
            background: radial-gradient(circle, rgba(255, 122, 0, 0.9), rgba(255, 122, 0, 0) 68%);
        }

        .smoke-purple {
            top: 18%;
            right: -12%;
            background: radial-gradient(circle, rgba(184, 76, 255, 0.95), rgba(184, 76, 255, 0) 68%);
            animation-delay: -8s;
            animation-duration: 30s;
        }

        .smoke-green {
            bottom: -18%;
            left: 28%;
            background: radial-gradient(circle, rgba(57, 255, 136, 0.75), rgba(57, 255, 136, 0) 68%);
            animation-delay: -14s;
            animation-duration: 28s;
        }

        @keyframes drift {
            0% { transform: translate3d(-4%, 2%, 0) scale(0.9) rotate(0deg); }
            50% { transform: translate3d(8%, -7%, 0) scale(1.15) rotate(18deg); }
            100% { transform: translate3d(-5%, 9%, 0) scale(1.05) rotate(-14deg); }
        }

        header, .menu-container {
            position: relative;
            z-index: 1;
        }

        h1 {
            color: var(--title-color) !important;
            text-shadow: 0 0 15px rgba(255, 122, 0, 0.65), 0 0 28px rgba(184, 76, 255, 0.35) !important;
        }

        .subtitle {
            color: #c68cff !important;
        }

        header {
            border-bottom-color: rgba(255, 122, 0, 0.45) !important;
        }

        .brand-section {
            background: var(--card-bg) !important;
            border-color: rgba(184, 76, 255, 0.48) !important;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75), 0 0 14px rgba(184, 76, 255, 0.08) !important;
            backdrop-filter: blur(5px);
        }

        .brand-header {
            border-bottom-color: rgba(255, 122, 0, 0.58) !important;
        }

        .brand-title {
            color: var(--accent-color) !important;
            text-shadow: 0 0 10px rgba(255, 122, 0, 0.3);
        }

        .brand-title::after {
            color: var(--price-color) !important;
        }

        .brand-meta, .status-dot {
            color: var(--price-color) !important;
        }

        .flavor-item {
            background: rgba(184, 76, 255, 0.08) !important;
        }

        .flavor-item:hover {
            background: rgba(255, 122, 0, 0.16) !important;
            border-color: rgba(57, 255, 136, 0.55) !important;
        }

        .status-dot {
            background-color: var(--price-color) !important;
            box-shadow: 0 0 6px var(--price-color) !important;
        }

        .flavor-item.out-of-stock {
            color: #a975b7 !important;
        }

        .flavor-item.out-of-stock::after {
            background-color: var(--sold-out-color) !important;
        }

        .out-of-stock .status-dot {
            background-color: var(--sold-out-color) !important;
            box-shadow: 0 0 6px var(--sold-out-color) !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .smoke { animation: none; }
        }
    </style>
</head>
<body>
    <div class="smoke-layer" aria-hidden="true">
        <span class="smoke smoke-orange"></span>
        <span class="smoke smoke-purple"></span>
        <span class="smoke smoke-green"></span>
    </div>

    <main id="menu-content" aria-live="polite">
        Loading menu…
    </main>

    <script>
        const legacyMenuUrl = 'https://raw.githubusercontent.com/egcaptaingibbs-bit/Vapelist/5c902da2b37a28b645bb3afc4bd625513f8f7876/index.html';

        fetch(legacyMenuUrl)
            .then((response) => {
                if (!response.ok) throw new Error(`Menu request failed: ${response.status}`);
                return response.text();
            })
            .then((source) => {
                const legacyDocument = new DOMParser().parseFromString(source, 'text/html');
                document.title = legacyDocument.title;

                const legacyStyles = legacyDocument.querySelector('style');
                if (legacyStyles) document.head.appendChild(legacyStyles.cloneNode(true));

                const content = document.getElementById('menu-content');
                content.replaceWith(...Array.from(legacyDocument.body.children).filter((element) => !element.matches('script')));

                legacyDocument.body.querySelectorAll('script').forEach((legacyScript) => {
                    const script = document.createElement('script');
                    script.textContent = legacyScript.textContent;
                    document.body.appendChild(script);
                });
            })
            .catch((error) => {
                document.getElementById('menu-content').textContent = 'The menu could not be loaded. Please refresh the page.';
                console.error(error);
            });
    </script>
</body>
</html>
